; ESP32-C3 + phyphox 创客传感器套件
; 编译示例：pio run -e 01_hello_phyphox
; 烧录示例：pio run -e 01_hello_phyphox -t upload
; 串口监视：pio device monitor

[platformio]
default_envs = 01_hello_phyphox
description = ESP32-C3 Phyphox maker sensors for youth STEM workshops

[env]
platform = espressif32 @ ^6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_mode = dio
board_build.partitions = huge_app.csv
build_flags =
  -Iinclude
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  staacks/phyphox BLE @ ^1.2.5
lib_ldf_mode = deep+

; ---------- 入门：无需外接传感器 ----------
[env:01_hello_phyphox]
build_src_filter = -<*> +<../examples/01_hello_phyphox/>

; ---------- 模拟量：电位器 / 光敏 / 土壤湿度等 ----------
[env:02_analog]
build_src_filter = -<*> +<../examples/02_analog/>

; ---------- DHT22 温湿度 ----------
[env:03_dht22]
build_src_filter = -<*> +<../examples/03_dht22/>
lib_deps =
  ${env.lib_deps}
  adafruit/DHT sensor library @ ^1.4.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14

; ---------- BME280 温湿度气压 ----------
[env:04_bme280]
build_src_filter = -<*> +<../examples/04_bme280/>
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit BME280 Library @ ^2.2.4
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  adafruit/Adafruit BusIO @ ^1.16.1

; ---------- HC-SR04 超声波测距 ----------
[env:05_ultrasonic]
build_src_filter = -<*> +<../examples/05_ultrasonic/>

; ---------- BH1750 光照 ----------
[env:06_bh1750]
build_src_filter = -<*> +<../examples/06_bh1750/>
lib_deps =
  ${env.lib_deps}
  claws/BH1750 @ ^1.3.0

; ---------- 创客套件：多传感器综合（编译期选择） ----------
[env:07_maker_kit]
build_src_filter = -<*> +<../examples/07_maker_kit/>
build_flags =
  ${env.build_flags}
  -DMAKER_ENABLE_ANALOG=1
  -DMAKER_ENABLE_DHT=1
  -DMAKER_ENABLE_BME280=0
  -DMAKER_ENABLE_ULTRASONIC=1
  -DMAKER_ENABLE_BH1750=0
lib_deps =
  ${env.lib_deps}
  adafruit/DHT sensor library @ ^1.4.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14
